        href: articles/solving.html
      - text: Model workspace and data
        href: articles/model_workspace.html
      - text: Folding and trimming
        href: articles/folding.html
      - text: "---"
      - text: "An existing model"
      - text: Two models from the field
        href: articles/field-models.html
      - text: "---"
      - text: "Reference"
      - text: Configuring solver paths
        href: articles/configuration.html
      - text: LaTeX rendering
        href: articles/latex.html

reference:
- title: Multimod classes
  desc: Constructors for the declarations a model is made of, and the text
    route for writing an equation.
  contents:
  - mm_equation
  - starts_with("multimod_")
  - starts_with("new_")
  - starts_with("as_multimod")
  - -new_ast
  - -starts_with("multimod_config")

- title: Abstract Syntax Tree (AST) classes
  desc: Nodes for expressions, references and index domains.
  contents:
  - new_ast
  - starts_with("ast_")
  - -ast_schema
  - -ast_json_schema
  - -ast_to_json
  - -ast_from_json

- title: Index aliases
  desc: Short index names used in rendered equations.
  contents:
  - add_index_aliases
  - generate_index_alias
  - generate_index_aliases
  - has_index_aliases

- title: Generic methods
  desc: Printing, plotting and summarising model objects.
  contents:
  - starts_with("print")
  - starts_with("summary")
  - starts_with("show")
  - matches("as.character")

- title: Schema and serialisation
  desc: The node schema, validation, and the JSON round trip.
  contents:
  - ast_schema
  - schema_type
  - schema_node_types
  - validate_ast
  - ast_json_schema
  - model_to_json
  - model_from_json
  - ast_to_json
  - ast_from_json
  - multimod-constructors
  - is_declaration

- title: GAMS
  desc: Read GAMS, and render a model or any node back to it.
  contents:
  - starts_with("read_gams")
  - parse_equation_header
  - parse_gams_equation
  - remove_ontext_offtext
  - is_gams_expression
  - starts_with("as_gams")
  - starts_with("write_gams")
  - matches("gams")

- title: GMPL / MathProg
  desc: Read MathProg, render it, and solve with the glpsol executable.
  contents:
  - starts_with("read_gmpl")
  - starts_with("as_gmpl")
  - starts_with("write_gmpl")
  - solve_gmpl
  - solve_glpk
  - read_csv_results
  - matches("gmpl")

- title: JuMP / Julia
  contents:
  - starts_with("read_jump")
  - starts_with("as_jump")
  - starts_with("write_jump")
  - solve_jump
  - matches("jump")
  - -compare_jump_stats

- title: Pyomo / Python
  contents:
  - starts_with("as_pyomo")
  - starts_with("write_pyomo")
  - solve_pyomo
  - matches("pyomo")

- title: LaTeX
  desc: Publication-ready rendering of equations and whole models.
  contents:
  - starts_with("as_latex")
  - starts_with("write_latex")
  - format_latex_aligned
  - matches("latex")

- title: Folding
  desc: Drop dimensions a parameter does not vary over.
  contents:
  - starts_with("fold_")
  - create_fold_spec
  - analyze_parameter_redundancy
  - analyze_dimension_redundancy
  - get_fold_summary
  - is_folded
  - get_active_dims
  - unfold_model

- title: Trimming
  desc: Drop symbols the model does not use.
  contents:
  - starts_with("trim_")
  - starts_with("untrim_")
  - get_trim_summary
  - is_trimmed

- title: Direct matrix and MPS backend
  desc: Assemble the LP from the AST, write MPS, solve in process.
  contents:
  - model_to_lp
  - build_col_index
  - build_row_index
  - build_triplets
  - check_matrix_numbers
  - mm_session
  - solve_highs
  - solve_mps
  - write_mps
  - read_mps_solution
  - read_highs_solution
  - read_cuopt_solution
  - read_solver_solution
  - write_solution
  - write_energyrt_output

- title: Model workspace and data management
  desc: Save, load and update a model and its data.
  contents:
  - save_model
  - load_model
  - get_data
  - update_parameter
  - update_mapping
  - save_parameter
  - export_model_source
  - add_set_data

- title: Configuration and environment
  desc: Where the interpreters and solvers are found.
  contents:
  - starts_with("multimod_config")
  - get_multimod_python
  - get_multimod_julia
  - get_multimod_glpsol
  - set_multimod_python
  - set_multimod_julia
  - set_multimod_glpsol
  - mm_setup_python
  - mm_check_python

- title: Data and examples
  contents:
  - example_models

- title: Utility functions
  desc: Helpers used across the package.
  contents:
  - validate
  - make_valid
  - starts_with("get_")
  - starts_with("set_")
  - starts_with("is_")
  - starts_with("check_")
  - starts_with("validate_")
  - starts_with("parse_")
  - starts_with("format_")
  - starts_with("extract_")
  - starts_with("alias_")
  - depth
  - matches("brackets")
  - matches("resolve|node|split|map_")
  - matches("build_symbols_list")
  - -get_data
  - -get_active_dims
  - -get_fold_summary
  - -get_trim_summary
  - -get_network_data
  - -starts_with("get_multimod")
  - -starts_with("set_multimod")
  - -starts_with("multimod_config")
  - -is_folded
  - -is_trimmed
  - -is_declaration
  - -is_gams_expression
  - -check_matrix_numbers
  - -parse_equation_header
  - -parse_gams_equation
  - -parse_jump_equation
  - -validate_ast
  - -format_latex_aligned
  - -schema_node_types

- title: Experimental
  desc: Exported but untested; interfaces may change or be withdrawn.
  contents:
  - as_r
  - as_r.ast_formula
  - as_rfunction
  - collect_ast_classes
  - starts_with("compare_")
  - quick_compare
  - matches("get_network_data")
  - matches("as_visNetwork")
  - matches("plot")
  - matches("draw")
  - starts_with("plot_")
  - starts_with("ggplot_")
  - evaluate_parameters
  - analyze_fold_opportunities
  - has_ast_formulas
  - starts_with("load_")
  - starts_with("save_")
  - starts_with("log_")
  - starts_with("restore_")
  - starts_with("populate_")
  - starts_with("register_")
  - starts_with("execute_")
  - -save_model
  - -load_model
  - -save_parameter
