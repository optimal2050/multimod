    news:
      text: News
      href: news/index.html
    articles:
      text: Tutorials
      menu:
      # - text: "Getting started"
      # - text: Overview
        # href: articles/multimod.html
      # - text: "---"
      - text: "A model from R"
      - text: Writing a model in R
        href: articles/ast.html
