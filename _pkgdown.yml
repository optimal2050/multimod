reference:
- title: Abstract Syntax Tree (AST) classes
  desc:  Data structures to represent mathematical expressions.
  contents:
  - new_ast
  - starts_with("ast_")

- title: Multimod classes
  desc:  Classes to represent a model with sets, parameters, variables, equations, and data.
  contents:
  - starts_with("multimod_")
  - starts_with("new_")
  - starts_with("as_multimod")

- title: Generic methods
  desc:  Generic methods for multimod classes.
  contents:
  # - starts_with("as_")
  - starts_with("print")
  - starts_with("plot")
  - starts_with("summary")
  - starts_with("show")
  - matches("as.character")

- title: LaTeX functions
  desc:  Functions to convert multimod objects to LaTeX.
  contents:
  - starts_with("as_latex")
  - starts_with("write_latex")
  - matches("latex")

- title: GAMS-related functions
  desc:  Functions to read GAMS models and convert multimod objects to GAMS code.
  contents:
  - starts_with("read_gams")
  - starts_with("as_gams")
  - starts_with("write_gams")
  - matches("gams")

- title: GMPL-related functions
  desc:  Functions to read GMPL models and convert multimod objects to GMPL code.
  contents:
  - starts_with("read_gmpl")
  - starts_with("as_gmpl")
  - starts_with("write_gmpl")
  - export_glpk_model
  - matches("gmpl")

- title: JuMP/Julia-related functions
  desc:  Functions to read JuMP models and convert multimod objects to JuMP code.
  contents:
  - starts_with("read_jump")
  - starts_with("as_jump")
  - starts_with("write_jump")
  - matches("jump")

- title: Pyomo/Python-related functions
  desc:  Functions to convert multimod objects to Pyomo code.
  contents:
  - starts_with("read_pyomo")
  - starts_with("as_pyomo")
  - starts_with("write_pyomo")
  - matches("pyomo")

- title: Configuration and Environment
  desc:  Functions for configuring solver paths and Python/Julia environments.
  contents:
  - get_multimod_python
  - get_multimod_julia
  - get_multimod_glpsol
  - set_multimod_python
  - set_multimod_julia
  - set_multimod_glpsol
  - starts_with("multimod_config")
  - setup_python_environment

- title: Folding functions
  desc:  Functions for parameter folding to reduce model size by eliminating redundant dimensions.
  contents:
  - starts_with("fold_")
  - create_fold_spec
  - create_fold_spec_energyRt
  - analyze_parameter_redundancy
  - analyze_dimension_redundancy
  - get_fold_summary
  - is_folded
  - get_active_dims
  - unfold_model

- title: Trimming functions
  desc:  Functions for model trimming to remove unused elements (empty data, unused variables, dead branches).
  contents:
  - starts_with("trim_")
  - starts_with("untrim_")
  - get_trim_summary
  - is_trimmed

- title: Model workspace and data management
  desc:  Functions for saving/loading models and managing model workspaces with multiple data formats.
  contents:
  - save_model
  - load_model
  - get_data
  - update_parameter
  - update_mapping
  - save_parameter
  - import_energyRt_data
  - populate_sets_from_scenario
  - link_scenario_data
  - import_osemosys_data
  - export_osemosys_to_csv
  - export_model_source
  - add_set_data
  - export_import_log_from_model

- title: Solver integration
  desc:  Functions for solving models and loading solutions.
  contents:
  - solve_jump
  - solve_pyomo
  - solve_glpk
  - starts_with("execute_")

- title: Model comparison and debugging
  desc:  Functions for comparing models, solutions, and debugging model generation.
  contents:
  - starts_with("compare_")

- title: Index aliases and mapping
  desc: Functions for managing index aliases and domain extraction.
  contents:
  - generate_index_alias
  - generate_index_aliases
  - add_index_aliases
  - has_index_aliases
  - en_extract_domains_from_comments

- title: Parameter evaluation and analysis
  desc: Functions for evaluating parameters and analyzing folding opportunities.
  contents:
  - evaluate_parameters
  - analyze_fold_opportunities
  - has_ast_formulas

- title: AST conversion to R
  desc: Functions for converting AST to R code.
  contents:
  - as_r
  - as_r.ast_formula
  - as_rfunction
  - collect_ast_classes

- title: Data and examples
  desc: Example datasets and models.
  contents:
  - example_models

- title: Utility functions
  desc:  Utility functions for multimod.
  contents:
  - validate
  - starts_with("get_")
  - starts_with("set_")
  - starts_with("is_")
  - starts_with("check_")
  - starts_with("validate_")
  - starts_with("parse_")
  - starts_with("format_")
  - starts_with("extract_")
  - starts_with("alias_")
  - depth
  - matches("brackets")
  - matches("resolve|node|split|map_")
  - matches("build_symbols_list")

- title: Internal and helper functions
  desc: Internal functions and helpers (typically not called directly by users).
  contents:
  - starts_with("load_")
  - starts_with("save_")
  - starts_with("log_")
  - starts_with("restore_")
  - starts_with("populate_")
  - starts_with("register_")
  - make_valid
  - quick_compare
  - mps_matrix_long
  - osemosys_dat_to_model
  - read_osemosys_dat
  - read_csv_results
  - load_osemosys_from_csv

- title: visualization
  desc:  Visualization functions for multimod.
  contents:
  - matches("get_network_data")
  - matches("as_visNetwork")
  - matches("plot")
  - matches("draw")
  - starts_with("plot_")
  - starts_with("ggplot_")
  - starts_with("draw_")
  - starts_with("render_")
  - starts_with("as_viz")
  - starts_with("as_diagram")
