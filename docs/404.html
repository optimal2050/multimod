<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>multimod: page not found</title>
<script>
  // The R site moved from /multimod/ to /multimod/r/ in October 2026.
  // A request for an old page is forwarded to its new location; anything
  // already under a language section is a genuine 404.
  (function () {
    var base = "/multimod/";
    var p = window.location.pathname;
    if (p.indexOf(base) !== 0) return;
    var rest = p.slice(base.length);
    if (rest === "" || /^(r|python|core)\//.test(rest)) return;
    window.location.replace(base + "r/" + rest +
                            window.location.search + window.location.hash);
  })();
</script>
<script data-goatcounter="https://multimod.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #333; }
  a { color: #31688E; }
</style>
</head>
